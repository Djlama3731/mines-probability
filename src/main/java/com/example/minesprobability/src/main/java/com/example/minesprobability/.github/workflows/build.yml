name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Donner les permissions à Gradle
        run: chmod +x gradlew

      - name: Compiler le mod
        run: ./gradlew build

      - name: Télécharger le fichier JAR
        uses: actions/upload-artifact@v4
        with:
          name: mines-probability
          path: build/libs/*.jar
